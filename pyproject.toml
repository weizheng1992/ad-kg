[project]
name = "adkg"
version = "0.1.0"
description = "本体驱动的广告营销知识中台——知识与管控层，为 Agent 引擎提供查什么、能动什么的依据"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "neo4j>=5.25",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.50",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
