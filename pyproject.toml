[project]
name = "adkg"
version = "0.1.0"
description = "本体驱动的广告营销知识中台——知识与管控层，为 Agent 引擎提供查什么、能动什么的依据"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "psycopg[binary,pool]>=3.2",
    "neo4j>=5.25",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sentence-transformers>=3.0",
    "pgvector>=0.3",
    "playwright>=1.49",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1",
    "jieba>=0.42.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
