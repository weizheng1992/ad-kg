# ==================================================================
# A 机公网入口 nginx 配置真源（README §9.8 / docs/deployment.md §五）
# 2026-10-24 真实系统化（spec §2）：登录改为服务端会话 cookie——
#   撤掉角色头→token 的 map（X-Adkg-Role 不再换发 Authorization；
#   web 会话由 adkg-api 的 app_session 表把门，token 只留给 smartServe/eval
#   的 Bearer 直连路）。HTTPS 上线时在 adkg-api 侧开 ADKG_COOKIE_SECURE=on。
# 首次落位：2026-10-23 按线上行为回填成文；2026-10-24 改会话制；下次登机 diff 校准。
# ==================================================================

limit_req_zone $binary_remote_addr zone=ask_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=agent_limit:10m rate=2r/s;   # SSE：一次对话一个长请求，burst 放宽

# 页面刷新撞 API 代理分流（缺陷备忘⑪）：与 API 同名的 SPA 页面路径（/graph /admin /menus
# /creators /cases /brands /settlements）浏览器直开/刷新是文档请求（Accept 含 text/html）——
# 回落 SPA；fetch/XHR/EventSource 的 Accept 不含 text/html，照常代理 API。map 只能放 http 块
# （本文件经 sites-enabled include 进 http 上下文，与上方 limit_req_zone 同级）
map $http_accept $is_doc {
    default 0;
    ~*text/html 1;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/adkg;                    # web/dist 静态（CI rsync）
    index index.html;

    # SSE 流式（spec §6 /agent/chat/stream）：长连接单独一把闸——更长读超时 + 逐事件透传
    location ~ ^/agent {
        proxy_pass http://127.0.0.1:8000;
        limit_req zone=agent_limit burst=10 nodelay;
        proxy_read_timeout 300s;                           # ReAct 循环墙钟上限 120s + 余量
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;                               # SSE 逐事件透传
    }

    # API 反代到本机 adkg-api（§9.8）：/auth 会话登录 + 业务端点；
    # Authorization 头透传（smartServe/eval 的 Bearer 直连路不受影响）
    location ~ ^/(auth|ask|graph|actions|guideline|ingest|creative|creators|cases|brands|settlements|stats|admin|menus|my-actions) {
        if ($is_doc) { rewrite ^ /index.html last; }       # 文档请求（页面直开/刷新）回落 SPA，不进 API（缺陷备忘⑪）
        proxy_pass http://127.0.0.1:8000;
        limit_req zone=ask_limit burst=3 nodelay;          # /ask 1r/s（LLM 慢路径防打穿）
        proxy_read_timeout 150s;                           # LLM 时延预算端到端上限（§7.2）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # 扫描器噪音不进 SPA fallback：常见探测后缀/路径直接 404（2026-10-22 访客统计：
    # SPA 兜底曾对 /portal/redlion 等回 200 污染日志）
    location ~* ^/.*\.(php|env|yaml|yml|git|asp|jsp|cgi)$ { return 404; }
    location ~* ^/(config|portal|admin\.php|wp-login|HNAP1|GponForm) { return 404; }

    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }       # SPA fallback
}
