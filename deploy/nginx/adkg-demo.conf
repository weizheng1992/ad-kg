# ==================================================================
# A 机公网入口 nginx 配置真源（README §9.8 / docs/deployment.md §五）
# 占位符 __TOKEN_*__ 安装时 sed 替换（仿 adkg-api.service 的 __USER__ 模式，
# token 只存服务器不入库）：
#   sed "s/__TOKEN_AE__/$T_AE/g; s/__TOKEN_OPTIMIZER__/$T_OPT/g; ... " \
#       deploy/nginx/adkg-demo.conf | sudo tee /etc/nginx/sites-available/adkg
# 首次落位：2026-10-23 按线上行为回填成文；下次登机部署时 diff 校准一次。
# ==================================================================

limit_req_zone $binary_remote_addr zone=ask_limit:10m rate=1r/s;

map $http_x_adkg_role $adkg_token {
    default "__TOKEN_MANAGEMENT__";
    "ae"         "__TOKEN_AE__";
    "optimizer"  "__TOKEN_OPTIMIZER__";
    "creative"   "__TOKEN_CREATIVE__";
    "client"     "__TOKEN_CLIENT__";
    "finance"    "__TOKEN_FINANCE__";
    "management" "__TOKEN_MANAGEMENT__";
    "admin"      "__TOKEN_ADMIN__";
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/adkg;                    # web/dist 静态（CI rsync）
    index index.html;

    # 登录壳换发的角色头 → 后端 token（头缺失 → Bearer 空 → 401，token 永不出服务器）
    proxy_set_header Authorization "Bearer $adkg_token";

    # 五路 API 反代到本机 adkg-api（§9.8）
    location ~ ^/(ask|graph|actions|guideline|ingest|agent|creative) {
        proxy_pass http://127.0.0.1:8000;
        limit_req zone=ask_limit burst=3 nodelay;          # /ask 1r/s（LLM 慢路径防打穿）
        proxy_read_timeout 150s;                           # LLM 时延预算端到端上限（§7.2）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 扫描器噪音不进 SPA fallback：常见探测后缀/路径直接 404（2026-10-22 访客统计：
    # SPA 兜底曾对 /portal/redlion 等回 200 污染日志）
    location ~* ^/.*\.(php|env|yaml|yml|git|asp|jsp|cgi)$ { return 404; }
    location ~* ^/(config|portal|admin\.php|wp-login|HNAP1|GponForm) { return 404; }

    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }       # SPA fallback
}
